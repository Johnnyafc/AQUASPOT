<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="aquaspot_postventa">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>aquaspot_postventa</title>
  <link rel="manifest" href="manifest.json">

  <!-- ⚙️ 1. DEPENDENCIAS DE FIREBASE: Sin esto, el navegador está ciego y sordo -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
</head>
<body>
  
  <!-- ⚙️ 2. ENCLAVAMIENTO DEL SERVICE WORKER (Debe ejecutarse ANTES de Flutter) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/firebase-messaging-sw.js')
          .then(function (registration) {
            console.log('✅ [BOOT] Receptor de Alarmas (FCM SW) registrado correctamente en el scope:', registration.scope);
          }).catch(function (err) {
            console.error('💥 [BOOT] Falla crítica al registrar el FCM SW:', err);
          });
      });
    } else {
      console.warn('⚠️ [BOOT] Este navegador no soporta Service Workers. Las notificaciones no funcionarán.');
    }
  </script>

  <!-- ⚙️ 3. BOOTLOADER NATIVO DE FLUTTER 3.22+ -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
